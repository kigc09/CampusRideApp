spring:
  application:
    name: CampusRideApp
  datasource:
    url: "jdbc:h2:file:./data/ride-registration;DB_CLOSE_ON_EXIT=FALSE"
    username: admin
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  logging:
    file:
      name: logs/ride-registration.log
      debug: true