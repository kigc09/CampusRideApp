<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:fragment="head">
    <meta charset="UTF-8">
    <title th:text="'Campus Ride Share :: '+${pageTitle ?: 'Home'}"></title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div th:fragment="header-nav" class="header-nav-container">
    <header>
        <img th:src="@{/images/header.png}" alt="Logo">
        <h1>Campus Ride Share</h1>
    </header>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/list}">View Rides</a>
        <a sec:authorize="hasAnyRole('ADMIN', 'DRIVER')" th:href="@{/register}">Register</a>
        <div class="nav-logout">
            <a sec:authorize="isAnonymous()" th:href="@{/login}">Sign Up/Login</a>
            <form sec:authorize="isAuthenticated()"
                  method="POST"
                  th:action="@{/logout}"
                  class="logoutBtn"
            >
                <input type="submit" value="Logout">
            </form>
        </div>
    </nav>
    <div class="welcome" sec:authorize="isAuthenticated()">
        Welcome <span sec:authentication="principal.fullname">FULLNAME</span>
    </div>
</div>
<footer th:fragment="footer" class="footer">
    <p>&copy; Campus Ride Share 2026</p>
    <a href="mailto:info@campusrideshare.com">Contact Us</a>
</footer>
</body>
</html>
